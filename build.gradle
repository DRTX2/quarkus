plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Platform
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-camel-bom:${quarkusPlatformVersion}")

    // Core & CDI
    implementation 'io.quarkus:quarkus-arc'

    // REST API (RESTEasy Reactive - Recomendado para Quarkus 3.x)
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest-client-jackson'

    // Database & Persistence (CRÍTICO - agregado driver PostgreSQL)
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-flyway' // Migraciones de BD

    // Validation
    implementation 'io.quarkus:quarkus-hibernate-validator'

    // Security
    implementation 'io.quarkus:quarkus-smallrye-jwt'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-security'

    // Documentation & Problem Details
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkiverse.resteasy-problem:quarkus-resteasy-problem:3.21.0'

    // Configuration
    implementation 'io.quarkus:quarkus-config-yaml'

    // Observability (Health, Metrics, Logging, Tracing)
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-logging-json'
    implementation 'io.quarkus:quarkus-opentelemetry'

    // Resilience & Performance
    implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'
    implementation 'io.quarkus:quarkus-cache'

    // Utilities
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'org.apache.camel.quarkus:camel-quarkus-mapstruct'

    // Email
    implementation 'io.quarkus:quarkus-mailer'

    // Testing
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.quarkus:quarkus-test-h2'
}

group = 'com.drtx.qks'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Función para cargar variables de entorno desde archivo .env
def loadEnvFile() {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                if (key && value) {
                    // Solo establecer si no existe en el sistema
                    if (!System.getenv(key)) {
                        System.setProperty(key, value)
                    }
                }
            }
        }
        println "✅ Variables de entorno cargadas desde .env"
    } else {
        println "⚠️  Archivo .env no encontrado, usando variables del sistema"
    }
}

// Cargar variables antes de cualquier tarea
gradle.taskGraph.whenReady {
    loadEnvFile()
}

// Aplicar variables de entorno a las tareas de Java
tasks.withType(JavaExec) {
    doFirst {
        loadEnvFile()
        // Pasar system properties como environment variables
        System.properties.each { key, value ->
            if (key.toString().startsWith('DB_') ||
                key.toString().startsWith('SERVER_') ||
                key.toString().startsWith('APP_') ||
                key.toString().startsWith('MAIL_') ||
                key.toString().startsWith('LOG_') ||
                key.toString().startsWith('CORS_')) {
                environment key.toString(), value.toString()
            }
        }
    }
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"

    doFirst {
        loadEnvFile()
    }
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
