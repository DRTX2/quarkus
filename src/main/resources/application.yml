#   1. Modificar variable QUARKUS_PROFILE en .env (dev o prod)
#   2. O usar: -Dquarkus.profile=dev/prod

quarkus:
  # APLICACIÓN
  application:
    name: ${APP_NAME:learning-quarkus}
    version: 1.0.0-SNAPSHOT

  # DATABASE - PostgreSQL
  datasource:
    db-kind: postgresql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quarkus_db}
      max-size: ${DB_POOL_MAX_SIZE:20}
      min-size: ${DB_POOL_MIN_SIZE:5}

  # HIBERNATE ORM
  hibernate-orm:
    database:
      generation: none # Usar Flyway para migraciones
    log:
      sql: false
      format-sql: true
    jdbc:
      statement-batch-size: 20

  # FLYWAY - Migraciones de Base de Datos
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

  # HTTP & CORS
  http:
    port: ${SERVER_PORT:8080}
    host: ${SERVER_HOST:0.0.0.0}
    cors:
      ~: true
      origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: accept,authorization,content-type,x-requested-with
      exposed-headers: Content-Disposition
      access-control-max-age: 24H

  # OPENAPI / SWAGGER UI
  swagger-ui:
    always-include: true
    path: /swagger-ui
    theme: flattop

  smallrye-openapi:
    info-title: Learning Quarkus API
    info-version: 1.0.0
    info-description: API completa y compleja con Quarkus
    info-contact-email: tu-email@example.com
    info-license-name: Apache 2.0
    info-license-url: https://www.apache.org/licenses/LICENSE-2.0.html

  # SECURITY - JWT
  smallrye-jwt:
    enabled: ${JWT_ENABLED:true}

  # JWT Configuration
  mp:
    jwt:
      verify:
        publickey:
          location: publicKey.pem
        issuer: ${JWT_ISSUER:https://learning-quarkus}

  # SECURITY - OIDC (Opcional)
  oidc:
    enabled: ${OIDC_ENABLED:false}
    # auth-server-url: ${OIDC_AUTH_SERVER_URL:https://localhost:8543/realms/quarkus}
    # client-id: ${OIDC_CLIENT_ID:backend-service}
    # credentials:
    #   secret: ${OIDC_CLIENT_SECRET:secret}

  # HEALTH CHECKS
  smallrye-health:
    root-path: /health
    liveness-path: /live
    readiness-path: /ready
    startup-path: /started

  # METRICS - Prometheus
  micrometer:
    enabled: ${METRICS_ENABLED:true}
    export:
      prometheus:
        enabled: ${METRICS_ENABLED:true}
        path: /metrics

  # LOGGING
  log:
    level: ${LOG_LEVEL:INFO}
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      json:
        ~: ${LOG_JSON_ENABLED:false}
    category:
      "com.drtx.qks":
        level: DEBUG
      "io.quarkus":
        level: INFO
      "org.hibernate":
        level: WARN

  # SCHEDULER
  scheduler:
    enabled: true
    overdue-grace-period: 60s

  # MAILER
  mailer:
    from: ${MAIL_FROM:noreply@example.com}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    start-tls: OPTIONAL
    mock: ${MAIL_MOCK:true}

# MICROPROFILE JWT
mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: ${JWT_ISSUER:https://learning-quarkus}

# CONFIGURACIÓN PERSONALIZADA
greeting:
  message: "hello"

app:
  name: ${APP_NAME:Learning Quarkus}
  environment: ${APP_ENV:development}
  features:
    registration-enabled: true
    email-verification-required: true
    admin-api-enabled: true