# ==============================================================================
# CONFIGURACIÓN GENERAL
# ==============================================================================
quarkus:
  application:
    name: learning-quarkus
    version: 1.0.0-SNAPSHOT

  # ============================================================================
  # DATABASE - PostgreSQL
  # ============================================================================
  datasource:
    db-kind: postgresql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quarkus_db}
      max-size: 20
      min-size: 5

  # ============================================================================
  # HIBERNATE ORM
  # ============================================================================
  hibernate-orm:
    database:
      generation: none # Usar Flyway para migraciones
    log:
      sql: true
      format-sql: true
    jdbc:
      statement-batch-size: 20

  # ============================================================================
  # FLYWAY - Migraciones de Base de Datos
  # ============================================================================
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1.0.0

  # ============================================================================
  # HTTP & CORS
  # ============================================================================
  http:
    port: ${PORT:8080}
    host: 0.0.0.0
    cors:
      ~: true
      origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: accept,authorization,content-type,x-requested-with
      exposed-headers: Content-Disposition
      access-control-max-age: 24H

  # ============================================================================
  # OPENAPI / SWAGGER UI
  # ============================================================================
  swagger-ui:
    always-include: true
    path: /swagger-ui
    theme: flattop

  smallrye-openapi:
    info-title: Learning Quarkus API
    info-version: 1.0.0
    info-description: API completa y compleja con Quarkus
    info-contact-email: tu-email@example.com
    info-license-name: Apache 2.0
    info-license-url: https://www.apache.org/licenses/LICENSE-2.0.html

  # ============================================================================
  # SECURITY - JWT & OIDC
  # ============================================================================
  smallrye-jwt:
    enabled: true

  oidc:
    enabled: false # Habilitar cuando uses Keycloak/Auth0
    # auth-server-url: ${OIDC_AUTH_SERVER_URL:https://localhost:8543/realms/quarkus}
    # client-id: ${OIDC_CLIENT_ID:backend-service}
    # credentials:
    #   secret: ${OIDC_CLIENT_SECRET:secret}

  # ============================================================================
  # HEALTH CHECKS
  # ============================================================================

  smallrye-health:
    root-path: /health
    liveness-path: /live
    readiness-path: /ready
    startup-path: /started

  # ============================================================================
  # METRICS - Prometheus
  # ============================================================================
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /metrics

  # ============================================================================
  # LOGGING
  # ============================================================================
  log:
    level: ${LOG_LEVEL:INFO}
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      json:
        ~: ${LOG_JSON_ENABLED:false} # true para logs en formato JSON
    category:
      "com.drtx.qks":
        level: DEBUG
      "io.quarkus":
        level: INFO
      "org.hibernate":
        level: WARN
      "org.hibernate.SQL":
        level: DEBUG

  # ============================================================================
  # CACHE
  # ============================================================================
  cache:
    type: caffeine
    caffeine:
      "user-cache":
        initial-capacity: 10
        maximum-size: 1000
        expire-after-write: 10M

  # ============================================================================
  # SCHEDULER
  # ============================================================================
  scheduler:
    enabled: true
    overdue-grace-period: 60s

  # ============================================================================
  # FAULT TOLERANCE
  # ============================================================================
  # smallrye-fault-tolerance:
  #   enabled: true  # Configuraciones específicas de fault tolerance

  # ============================================================================
  # KAFKA (Opcional - descomentar si usas)
  # ============================================================================
  # kafka:
  #   bootstrap:
  #     servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # smallrye:
  #   messaging:
  #     kafka:
  #       health:
  #         enabled: true

  # ============================================================================
  # MAILER
  # ============================================================================
  mailer:
    from: ${MAIL_FROM:noreply@example.com}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    start-tls: OPTIONAL
    mock: ${MAIL_MOCK:true} # Cambiar a false en producción

# ==============================================================================
# CONFIGURACIÓN PERSONALIZADA
# ==============================================================================
greeting:
  message: "hello"

# Puedes agregar más configuraciones personalizadas aquí
app:
  name: Learning Quarkus
  environment: ${APP_ENV:development}
  features:
    registration-enabled: true
    email-verification-required: true
    admin-api-enabled: true


